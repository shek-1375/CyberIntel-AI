services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Day 6: PostgreSQL stores saved investigations and question history
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberintel
      POSTGRES_PASSWORD: cyberintel
      POSTGRES_DB: cyberintel
    ports:
      - "5433:5432"   # 5433 on your computer, so it never clashes with a PostgreSQL already installed on Windows
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberintel -d cyberintel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
